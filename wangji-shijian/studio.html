<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>忘记时间 · 手绘水彩 MV</title>
<style>
  @font-face { font-family: 'Ma Shan Zheng'; font-style: normal; font-weight: 400; font-display: block;
               src: url('assets/fonts/mashanzheng.woff2') format('woff2'); }
  @font-face { font-family: 'Permanent Marker'; src: local('Comic Sans MS'), local('Chalkboard SE'); }
  @font-face { font-family: 'Shantell Sans'; src: local('Chalkboard SE'), local('Comic Sans MS'); }
</style>
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="272" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/karaoke.js"></script>
<!-- 忘记时间: shared world / cast / props -->
<script src="src/set.js"></script>
<script src="src/probe.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<!-- scenes, in time order -->
<script src="src/scenes/c01_intro.js"></script>
<script src="src/scenes/c02_walk.js"></script>
<script src="src/scenes/c03_break.js"></script>
<script src="src/scenes/c04_chorus1.js"></script>
<script src="src/scenes/c05_rain.js"></script>
<script src="src/scenes/c06_interlude.js"></script>
<script src="src/scenes/c07_chorus2.js"></script>
<script src="src/scenes/c08_deepest.js"></script>
<script src="src/scenes/c09_outro.js"></script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
