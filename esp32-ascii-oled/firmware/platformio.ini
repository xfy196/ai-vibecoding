; ESP32 DevKit V1 + 0.96" SSD1306 OLED · ASCII 动画屏
;
;   esp32dev  ESP32 DevKit V1 (WROOM-32)  SDA=GPIO21  SCL=GPIO22  按键=GPIO4
;
; 编译：pio run
; 烧录：pio run -t upload
; 串口：pio device monitor        （115200，DevKit V1 多为 CH340 / CP2102）
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DSSD1306_NO_SPLASH
    -Wall

lib_deps =
    olikraus/U8g2
