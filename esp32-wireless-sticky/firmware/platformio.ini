; ESP32 DevKit V1 + 0.96" SSD1306 OLED · 无线便利贴
;
;   esp32dev  ESP32 DevKit V1 (WROOM-32)  SDA=GPIO21  SCL=GPIO22  按键=板载 BOOT(GPIO0)
;
; 编译：pio run
; 烧录：pio run -t upload
; 串口：pio device monitor        （115200，DevKit V1 走 CH340 / CP2102）
;
; 第一次上电默认开热点：StickyNote-XXXX / stickynote
; 手机连上后浏览器打开 192.168.4.1 就能打字。
;
; 想改成「连家里 WiFi」：把 src/secrets.h.example 复制成 src/secrets.h，
; 填好 WIFI_SSID / WIFI_PASS 再烧录，屏幕会显示分配到的 IP。

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time

; U8g2 的 GB2312 中文字库约 200KB，本固件已到 1.02MB；默认 1.25MB app 分区
; 余量太小，换成 3MB app / 1MB SPIFFS 的 huge_app 分区表，给 OTA 留空间。
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DSSD1306_NO_SPLASH
    -finput-charset=UTF-8
    -fexec-charset=UTF-8
    -Wall

lib_deps =
    olikraus/U8g2 @ ^2.36.15
    esp32async/AsyncTCP @ ^3.5.0
    esp32async/ESPAsyncWebServer @ ^3.12.1
