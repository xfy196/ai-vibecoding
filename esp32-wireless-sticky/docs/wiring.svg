<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1960" viewBox="0 0 800 980"
     font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">

  <!-- ==================== 背景 ==================== -->
  <rect width="800" height="980" fill="#f4f6fb"/>
  <circle cx="762" cy="42" r="108" fill="#e3eaf8" opacity="0.7"/>
  <circle cx="20" cy="920" r="78" fill="#e3eaf8" opacity="0.55"/>

  <!-- ==================== 标题 ==================== -->
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">ESP32 DevKit V1 × 0.96″ OLED</text>
  <text x="40" y="68" font-size="11.5" fill="#64748b">无线便利贴 · 手机浏览器打字实时上屏 · SSD1306 128×64 · I2C 四线 · 2.4GHz 热点</text>

  <rect x="466" y="27" width="104" height="32" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="481" cy="43" r="3.4" fill="#f59e0b"/>
  <text x="490" y="47" font-size="10" font-weight="700" fill="#b45309">BOOT  GPIO0</text>

  <rect x="578" y="27" width="86" height="32" rx="16" fill="#ffffff" stroke="#dbe3f0"/>
  <circle cx="593" cy="43" r="3.4" fill="#2563eb"/>
  <text x="602" y="47" font-size="10" font-weight="700" fill="#1d4ed8">SDA  21</text>

  <rect x="672" y="27" width="88" height="32" rx="16" fill="#ffffff" stroke="#dbe3f0"/>
  <circle cx="687" cy="43" r="3.4" fill="#16a34a"/>
  <text x="696" y="47" font-size="10" font-weight="700" fill="#15803d">SCL  22</text>

  <!-- ==================== ESP32 DevKit V1 卡片 ==================== -->
  <rect x="40" y="100" width="210" height="300" rx="16" fill="#1e293b" stroke="#0b1220" stroke-width="1.2"/>
  <rect x="48" y="108" width="194" height="284" rx="11" fill="none" stroke="#334155"/>

  <text x="60" y="131" font-size="14.5" font-weight="700" fill="#f8fafc">ESP32 DevKit V1</text>
  <text x="60" y="147" font-size="9" fill="#94a3b8">WROOM-32 · 30-pin · 2.4GHz</text>

  <!-- 板载天线 -->
  <g stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M146 180 h14 v-8 h14 v8 h14 v-8 h14 v8 h14"/>
  </g>
  <text x="146" y="196" font-size="6.5" fill="#64748b">2.4G 天线</text>

  <!-- WROOM-32 模块 -->
  <rect x="62" y="164" width="80" height="66" rx="4" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="68" y="170" width="68" height="54" rx="2" fill="none" stroke="#94a3b8"/>
  <text x="102" y="194" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">WROOM-32</text>
  <text x="102" y="207" font-size="6.5" fill="#64748b" text-anchor="middle">ESP32-D0WD</text>

  <text x="62" y="246" font-size="8" fill="#64748b">逻辑画法：只画用到的 4 个脚，</text>
  <text x="62" y="258" font-size="8" fill="#64748b">真实排针顺序见下方排针图</text>

  <circle cx="66" cy="275" r="2.6" fill="#22c55e"/>
  <text x="73" y="278" font-size="7" fill="#94a3b8">GPIO2 = 板载 LED（高电平亮）</text>

  <!-- EN / BOOT：BOOT 高亮 = 实体按键 -->
  <rect x="103" y="296" width="56" height="21" rx="5" fill="#3b2a12" stroke="#f59e0b" stroke-width="1.3"/>
  <rect x="62" y="300" width="34" height="13" rx="3" fill="#334155" stroke="#475569"/>
  <text x="79" y="309.5" font-size="6.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">EN</text>
  <rect x="108" y="300" width="44" height="13" rx="3" fill="#7c4a03" stroke="#fbbf24"/>
  <text x="130" y="309.5" font-size="6.5" font-weight="700" fill="#fff7ed" text-anchor="middle">BOOT</text>
  <text x="164" y="309" font-size="6.5" fill="#fbbf24">= GPIO0</text>

  <!-- USB-UART + micro-USB -->
  <rect x="62" y="330" width="84" height="16" rx="3" fill="#243144" stroke="#3b4a63"/>
  <text x="104" y="341" font-size="6" fill="#8fa3bf" text-anchor="middle">CH340 / CP2102</text>

  <rect x="62" y="360" width="38" height="13" rx="3" fill="#94a3b8" stroke="#64748b"/>
  <rect x="68" y="363" width="26" height="7" rx="1.5" fill="#475569"/>
  <text x="106" y="369" font-size="6.5" fill="#94a3b8">micro-USB（5V 供电）</text>

  <text x="62" y="391" font-size="8" font-weight="700" fill="#fbbf24">↑ 短按看地址 · 长按 1.2s 清空便签</text>

  <!-- 右缘引脚 -->
  <g>
    <rect x="238" y="205" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="214" r="2.6" fill="#111827"/>
    <text x="230" y="218.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">3V3</text>

    <rect x="238" y="243" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="252" r="2.6" fill="#111827"/>
    <text x="230" y="256.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">GND</text>

    <rect x="238" y="281" width="20" height="18" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <circle cx="256" cy="290" r="2.6" fill="#111827"/>
    <text x="230" y="294.5" font-size="11.5" font-weight="700" fill="#bfdbfe" text-anchor="end">GPIO21</text>

    <rect x="238" y="319" width="20" height="18" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
    <circle cx="256" cy="328" r="2.6" fill="#111827"/>
    <text x="230" y="332.5" font-size="11.5" font-weight="700" fill="#bbf7d0" text-anchor="end">GPIO22</text>
  </g>

  <!-- ==================== OLED 卡片 ==================== -->
  <rect x="440" y="100" width="204" height="300" rx="16" fill="#1e293b" stroke="#0b1220" stroke-width="1.2"/>
  <rect x="448" y="108" width="188" height="284" rx="11" fill="none" stroke="#334155"/>

  <text x="464" y="132" font-size="15" font-weight="700" fill="#f8fafc">OLED 0.96″</text>
  <text x="464" y="148" font-size="9" fill="#94a3b8">SSD1306 · 128×64 · I2C</text>

  <!-- 屏玻璃：便利贴内容（局部坐标 128×64） -->
  <rect x="474" y="160" width="148" height="74" rx="3" fill="#05080f" stroke="#2b3648"/>
  <g transform="translate(474,160) scale(1.15625)">
    <!-- 正文 3 行 -->
    <g fill="#e8f1ff" font-size="9.5" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <text x="2" y="11">晚上七点，楼下</text>
      <text x="2" y="23">那家面馆见。</text>
      <text x="2" y="35">记得带把伞。</text>
    </g>
    <!-- 光标 -->
    <rect x="60" y="26" width="1" height="10" fill="#e8f1ff"/>
    <!-- 在线状态点（右上角） -->
    <rect x="123" y="2" width="3" height="3" fill="#e8f1ff"/>
    <!-- 翻页小点（右侧） -->
    <rect x="125" y="26" width="2" height="2" fill="#e8f1ff"/>
    <circle cx="126" cy="31" r="1" fill="#e8f1ff" opacity="0.5"/>
    <circle cx="126" cy="36" r="1" fill="#e8f1ff" opacity="0.5"/>
  </g>

  <!-- 左缘引脚 -->
  <g>
    <rect x="420" y="205" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="214" r="2.6" fill="#111827"/>
    <text x="452" y="218.5" font-size="11.5" fill="#e2e8f0">VCC</text>

    <rect x="420" y="243" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="252" r="2.6" fill="#111827"/>
    <text x="452" y="256.5" font-size="11.5" fill="#e2e8f0">GND</text>

    <rect x="420" y="281" width="20" height="18" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <circle cx="424" cy="290" r="2.6" fill="#111827"/>
    <text x="452" y="294.5" font-size="11.5" font-weight="700" fill="#dbeafe">SDA</text>

    <rect x="420" y="319" width="20" height="18" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
    <circle cx="424" cy="328" r="2.6" fill="#111827"/>
    <text x="452" y="332.5" font-size="11.5" font-weight="700" fill="#dcfce7">SCL</text>
  </g>

  <text x="464" y="366" font-size="8" fill="#64748b">认准 4 针 I2C 版（丝印可能是</text>
  <text x="464" y="378" font-size="8" fill="#64748b">SDA/SDI、SCL/SCK），7 针 SPI 版不适用</text>

  <!-- ==================== 连线 ==================== -->
  <g stroke-linecap="round">
    <line x1="258" y1="214" x2="420" y2="214" stroke="#ef4444" stroke-width="3.4"/>
    <line x1="258" y1="252" x2="420" y2="252" stroke="#334155" stroke-width="3.4"/>
    <line x1="258" y1="290" x2="420" y2="290" stroke="#2563eb" stroke-width="3.4"/>
    <line x1="258" y1="328" x2="420" y2="328" stroke="#16a34a" stroke-width="3.4"/>
  </g>

  <!-- 线缆标签 -->
  <g font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">
    <rect x="293" y="203" width="100" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="218">3V3 → VCC</text>

    <rect x="318" y="241" width="50" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="256">GND</text>

    <rect x="293" y="279" width="100" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="294">GPIO21 · SDA</text>

    <rect x="293" y="317" width="100" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="332">GPIO22 · SCL</text>
  </g>

  <g font-size="7.5" fill="#94a3b8" text-anchor="middle">
    <text x="343" y="194">红</text>
    <text x="343" y="232">黑</text>
    <text x="343" y="270">蓝</text>
    <text x="343" y="308">绿</text>
  </g>

  <!-- ==================== 连接方式 ==================== -->
  <rect x="40" y="418" width="720" height="282" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="58" y="432" width="3" height="13" rx="1.5" fill="#2563eb"/>
  <text x="70" y="443" font-size="12.5" font-weight="700" fill="#0f172a">连接方式 · 手机直连板子热点（不需要路由器）</text>

  <!-- 手机 -->
  <rect x="58" y="462" width="104" height="204" rx="16" fill="#0f172a" stroke="#0b1220" stroke-width="1.2"/>
  <rect x="66" y="478" width="88" height="164" rx="5" fill="#f8fafc"/>
  <rect x="90" y="468" width="40" height="5" rx="2.5" fill="#334155"/>
  <circle cx="110" cy="654" r="6" fill="none" stroke="#334155"/>

  <!-- 手机浏览器 -->
  <rect x="66" y="478" width="88" height="15" fill="#e8eef8"/>
  <text x="110" y="488" font-size="5.5" fill="#475569" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">192.168.4.1</text>

  <text x="72" y="507" font-size="7" font-weight="700" fill="#0f172a">无线便利贴</text>
  <circle cx="138" cy="504.5" r="2" fill="#22c55e"/>
  <text x="143" y="507" font-size="4.5" fill="#16a34a">已连接</text>

  <rect x="72" y="514" width="76" height="48" rx="4" fill="#fffdf6" stroke="#e7e0cf"/>
  <g stroke="#e7e0cf" stroke-width="0.4">
    <line x1="72" y1="524" x2="148" y2="524"/>
    <line x1="72" y1="534" x2="148" y2="534"/>
    <line x1="72" y1="544" x2="148" y2="544"/>
    <line x1="72" y1="554" x2="148" y2="554"/>
  </g>
  <g font-size="5.2" fill="#475569">
    <text x="75" y="522.5">晚上七点，楼下</text>
    <text x="75" y="532.5">那家面馆见。</text>
    <text x="75" y="542.5">记得带把伞。</text>
  </g>

  <rect x="72" y="568" width="34" height="12" rx="6" fill="#eef2f8" stroke="#dbe3f0"/>
  <text x="89" y="576.5" font-size="5" fill="#64748b" text-anchor="middle">清空</text>
  <rect x="112" y="568" width="36" height="12" rx="6" fill="#1d4ed8"/>
  <text x="130" y="576.5" font-size="5" fill="#ffffff" text-anchor="middle">实时同步</text>

  <text x="110" y="690" font-size="6.5" fill="#94a3b8" text-anchor="middle">手机浏览器 / 无需 App</text>

  <!-- Wi-Fi 电波 -->
  <g stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M196 536 q9 -9 18 0"/>
    <path d="M189 529 q16 -16 32 0"/>
    <path d="M182 522 q23 -23 46 0"/>
  </g>
  <line x1="172" y1="556" x2="286" y2="556" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="4 4"/>
  <rect x="174" y="568" width="108" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="228" y="583" font-size="8.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">2.4GHz Wi-Fi</text>

  <!-- 板子（热点端） -->
  <rect x="288" y="466" width="146" height="200" rx="12" fill="#1e293b" stroke="#0b1220"/>
  <text x="361" y="486" font-size="9.5" font-weight="700" fill="#f8fafc" text-anchor="middle">ESP32 · 热点</text>

  <rect x="304" y="496" width="114" height="58" rx="2" fill="#05080f" stroke="#334155"/>
  <g fill="#e8f1ff" font-size="6.5" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="310" y="508">晚上七点，楼下面馆见。</text>
    <text x="310" y="519">记得带把伞。</text>
  </g>
  <rect x="410" y="498" width="3" height="3" fill="#e8f1ff"/>

  <g font-size="7" fill="#94a3b8" font-family="'SF Mono','Menlo','Consolas',monospace">
    <text x="304" y="572">SSID  StickyNote-A1B2</text>
    <text x="304" y="585">PASS  stickynote</text>
    <text x="304" y="598">OPEN  192.168.4.1</text>
  </g>

  <circle cx="306" cy="628" r="2.6" fill="#22c55e"/>
  <text x="313" y="631" font-size="6.5" fill="#64748b">USB 5V 供电 · 峰值 200mA+</text>
  <text x="313" y="644" font-size="6.5" fill="#64748b">没网也能用，热点直连</text>

  <!-- 步骤 -->
  <g font-size="8.5" fill="#475569">
    <text x="462" y="486" font-size="9" font-weight="700" fill="#0f172a">三步用起来</text>
    <text x="462" y="508">① 手机 Wi-Fi 连 <tspan font-weight="700" fill="#1d4ed8">StickyNote-XXXX</tspan></text>
    <text x="462" y="523">② 密码输入 <tspan font-weight="700" fill="#1d4ed8">stickynote</tspan></text>
    <text x="462" y="538">③ 浏览器打开 <tspan font-weight="700" fill="#1d4ed8">192.168.4.1</tspan></text>
    <text x="462" y="559">打字即上屏，多个手机可同时连。</text>
    <text x="462" y="574">换手机 / 刷新页面会自动拉回当前内容。</text>
  </g>

  <line x1="462" y1="588" x2="736" y2="588" stroke="#e2e8f0"/>

  <text x="462" y="606" font-size="9" font-weight="700" fill="#0f172a">想连家里 WiFi？</text>
  <g font-size="8" fill="#64748b">
    <text x="462" y="623">把 <tspan font-weight="700" fill="#b45309">secrets.h.example</tspan> 复制成 secrets.h，</text>
    <text x="462" y="637">填 SSID / 密码再烧录，屏幕会显示分配到的 IP。</text>
    <text x="462" y="651">同一 WiFi 下访问 <tspan font-weight="700" fill="#1d4ed8">http://sticky.local</tspan> 即可。</text>
  </g>
  <text x="462" y="674" font-size="7.5" fill="#94a3b8">热点连不上路由器时，60 秒后会自动切回 AP 模式。</text>

  <!-- ==================== 30 pin 排针 ==================== -->
  <rect x="40" y="716" width="352" height="214" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="58" y="730" width="3" height="13" rx="1.5" fill="#2563eb"/>
  <text x="70" y="741" font-size="12" font-weight="700" fill="#0f172a">30 pin 右排节选</text>
  <text x="70" y="756" font-size="7.5" fill="#94a3b8">天线朝上、USB 朝下；按丝印找这 4 根</text>

  <text x="58" y="774" font-size="7" font-weight="700" fill="#94a3b8">右排（本项目用这排）</text>
  <g font-size="7.5" text-anchor="middle">
    <rect x="58" y="780" width="54" height="13" rx="3" fill="#fbbf24" stroke="#b45309"/>
    <text x="85" y="789.5" font-weight="700" fill="#111827">3V3</text>
    <rect x="58" y="796" width="54" height="13" rx="3" fill="#fbbf24" stroke="#b45309"/>
    <text x="85" y="805.5" font-weight="700" fill="#111827">GND</text>
    <rect x="58" y="812" width="54" height="13" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="85" y="821.5" fill="#334155">D15</text>
    <rect x="58" y="828" width="54" height="13" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="85" y="837.5" fill="#334155">D2</text>
    <rect x="58" y="844" width="54" height="13" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="85" y="853.5" fill="#334155">D4</text>
    <rect x="58" y="860" width="54" height="13" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="85" y="869.5" font-weight="700" fill="#1e3a8a">D21</text>
    <rect x="58" y="876" width="54" height="13" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="85" y="885.5" fill="#334155">D3</text>
    <rect x="58" y="892" width="54" height="13" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="85" y="901.5" font-weight="700" fill="#14532d">D22</text>
  </g>
  <g font-size="7" fill="#64748b">
    <text x="128" y="789">← OLED VCC</text>
    <text x="128" y="805">← OLED GND</text>
    <text x="128" y="869">← OLED SDA（蓝线）</text>
    <text x="128" y="901">← OLED SCL（绿线）</text>
  </g>

  <text x="58" y="917" font-size="7" fill="#94a3b8">注意：D21 / D22 中间隔着 D3(RX0)、D1(TX0)，</text>
  <text x="58" y="927" font-size="7" fill="#94a3b8">别按位置数错；以板子丝印为准。</text>

  <!-- ==================== 接线要点 ==================== -->
  <rect x="408" y="716" width="352" height="214" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="426" y="730" width="3" height="13" rx="1.5" fill="#16a34a"/>
  <text x="438" y="741" font-size="12" font-weight="700" fill="#0f172a">接线要点 · 七句话</text>

  <g font-size="8" fill="#475569">
    <circle cx="430" cy="762" r="1.8" fill="#94a3b8"/>
    <text x="440" y="765">VCC 只接 <tspan font-weight="700" fill="#b45309">3V3</tspan>，接 5V / VIN 会烧屏；GND 必须共地</text>

    <circle cx="430" cy="784" r="1.8" fill="#94a3b8"/>
    <text x="440" y="787">SDA = <tspan font-weight="700" fill="#1d4ed8">GPIO21</tspan>，SCL = <tspan font-weight="700" fill="#15803d">GPIO22</tspan>，是 ESP32 默认 I2C 脚</text>

    <circle cx="430" cy="806" r="1.8" fill="#94a3b8"/>
    <text x="440" y="809">0.96″ 屏一般是 3.3V；模块自带 4.7k 上拉，不用外接电阻</text>

    <circle cx="430" cy="828" r="1.8" fill="#94a3b8"/>
    <text x="440" y="831">板载 <tspan font-weight="700" fill="#b45309">BOOT = GPIO0</tspan>：短按看地址，长按 1.2s 清空</text>

    <circle cx="430" cy="850" r="1.8" fill="#94a3b8"/>
    <text x="440" y="853">I2C 400kHz，全屏刷新约 25ms；USB 供电即可</text>

    <circle cx="430" cy="872" r="1.8" fill="#94a3b8"/>
    <text x="440" y="875">不接屏幕也能跑（无显示），串口会打印访问地址</text>

    <circle cx="430" cy="894" r="1.8" fill="#94a3b8"/>
    <text x="440" y="897">换线前先断电；屏幕排针别插反（VCC/GND 对调必烧）</text>
  </g>

  <text x="440" y="919" font-size="7" fill="#94a3b8">引脚定义集中在 <tspan font-family="'SF Mono','Menlo','Consolas',monospace">src/config.h</tspan>，改线只改这里。</text>

  <!-- ==================== 页脚 ==================== -->
  <text x="40" y="962" font-size="9" fill="#94a3b8">断电后接线 · 上电前复查 VCC / GND</text>
