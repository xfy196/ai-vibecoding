; ESP32 + 0.96" OLED NTP 网络时钟
;
; 两种板子，选一个环境（引脚定义在 src/config.h 的「板型」区）：
;   esp32c3   ESP32-C3 SuperMini      SDA=IO4    SCL=IO5    按钮=IO3
;   esp32dev  ESP32 DevKit V1 WROOM   SDA=GPIO21 SCL=GPIO22 按钮=GPIO4
;
;   编译：pio run                 （默认 esp32c3）
;         pio run -e esp32dev     （DevKit V1）
;   烧录：pio run -t upload      / pio run -e esp32dev -t upload
;   串口：pio device monitor     （DevKit V1 是 UART + CH340/CP2102，先装驱动）
;
; C3 SuperMini 的板载 USB-C 是原生 USB（没有 CH340），必须打开 USB CDC，
; 否则串口监视器里什么都看不到。DevKit V1 走 UART，不需要这两个宏。
; 调试串口时把 config.h 里 DEBUG_KEEP_AWAKE 设为 1，否则深睡会把串口断掉。
;
; 第一次编译前先把 WiFi 账号填好（可选）：
;   cp src/secrets.h.example src/secrets.h

[platformio]
default_envs = esp32c3

; ---------------- ESP32-C3 SuperMini ----------------
[env:esp32c3]
platform = espressif32 @ 6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time

build_flags =
    -DBOARD_ESP32_C3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSSD1306_NO_SPLASH
    -Wall

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.17
    adafruit/Adafruit GFX Library @ ^1.13.0
    adafruit/Adafruit BusIO @ ^1.17.4

; ---------------- ESP32 DevKit V1 (WROOM-32, 30 pin) ----------------
[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time

build_flags =
    -DBOARD_ESP32_DEVKIT_V1
    -DCORE_DEBUG_LEVEL=0
    -DSSD1306_NO_SPLASH
    -Wall

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.17
    adafruit/Adafruit GFX Library @ ^1.13.0
    adafruit/Adafruit BusIO @ ^1.17.4
