<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1880" viewBox="0 0 800 940"
     font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">

  <!-- ==================== 背景 ==================== -->
  <rect width="800" height="940" fill="#f4f6fb"/>
  <circle cx="762" cy="42" r="108" fill="#e3eaf8" opacity="0.7"/>
  <circle cx="20" cy="880" r="78" fill="#e3eaf8" opacity="0.55"/>

  <!-- ==================== 标题 ==================== -->
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">ESP32 DevKit V1 (WROOM-32) × 0.96″ OLED</text>
  <text x="40" y="68" font-size="11.5" fill="#64748b">NTP 网络时钟接线 · SSD1306 128×64 · I2C 四线 · 3.3V 供电 · 可选 GPIO4 唤醒键</text>

  <rect x="560" y="27" width="200" height="32" rx="16" fill="#ffffff" stroke="#dbe3f0"/>
  <circle cx="575" cy="43" r="3.4" fill="#2563eb"/>
  <text x="584" y="47" font-size="10.5" font-weight="700" fill="#1d4ed8">SDA  GPIO21</text>
  <circle cx="672" cy="43" r="3.4" fill="#16a34a"/>
  <text x="681" y="47" font-size="10.5" font-weight="700" fill="#15803d">SCL  GPIO22</text>

  <!-- ==================== ESP32 DevKit V1 卡片 ==================== -->
  <rect x="40" y="100" width="210" height="300" rx="16" fill="#1e293b" stroke="#0b1220" stroke-width="1.2"/>
  <rect x="48" y="108" width="194" height="284" rx="11" fill="none" stroke="#334155"/>

  <text x="60" y="131" font-size="14.5" font-weight="700" fill="#f8fafc">ESP32 DevKit V1</text>
  <text x="60" y="147" font-size="9" fill="#94a3b8">WROOM-32 · 30-pin · 2.4GHz</text>

  <!-- 板载天线 -->
  <g stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M146 180 h14 v-8 h14 v8 h14 v-8 h14 v8 h14"/>
  </g>
  <text x="146" y="196" font-size="6.5" fill="#64748b">2.4G 天线</text>

  <!-- WROOM-32 模块 -->
  <rect x="62" y="164" width="80" height="66" rx="4" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="68" y="170" width="68" height="54" rx="2" fill="none" stroke="#94a3b8"/>
  <text x="102" y="194" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">WROOM-32</text>
  <text x="102" y="207" font-size="6.5" fill="#64748b" text-anchor="middle">ESP32-D0WD</text>

  <text x="62" y="246" font-size="8" fill="#64748b">逻辑画法：只画用到的 4 个脚，</text>
  <text x="62" y="258" font-size="8" fill="#64748b">真实排针顺序见下方排针图</text>

  <circle cx="66" cy="275" r="2.6" fill="#22c55e"/>
  <text x="73" y="278" font-size="7" fill="#94a3b8">GPIO2 = 板载 LED（高电平亮）</text>

  <!-- EN / BOOT -->
  <rect x="62" y="300" width="34" height="13" rx="3" fill="#334155" stroke="#475569"/>
  <text x="79" y="309.5" font-size="6.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">EN</text>
  <rect x="106" y="300" width="44" height="13" rx="3" fill="#334155" stroke="#475569"/>
  <text x="128" y="309.5" font-size="6.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">BOOT</text>
  <text x="154" y="309" font-size="6.5" fill="#94a3b8">= GPIO0</text>

  <!-- USB-UART + micro-USB -->
  <rect x="62" y="330" width="84" height="16" rx="3" fill="#243144" stroke="#3b4a63"/>
  <text x="104" y="341" font-size="6" fill="#8fa3bf" text-anchor="middle">CH340 / CP2102</text>

  <rect x="62" y="360" width="38" height="13" rx="3" fill="#94a3b8" stroke="#64748b"/>
  <rect x="68" y="363" width="26" height="7" rx="1.5" fill="#475569"/>
  <text x="106" y="369" font-size="6.5" fill="#94a3b8">micro-USB</text>

  <!-- 右缘引脚（逻辑顺序） -->
  <g>
    <rect x="238" y="205" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="214" r="2.6" fill="#111827"/>
    <text x="230" y="218.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">3V3</text>

    <rect x="238" y="243" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="252" r="2.6" fill="#111827"/>
    <text x="230" y="256.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">GND</text>

    <rect x="238" y="281" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="290" r="2.6" fill="#111827"/>
    <text x="230" y="294.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">GPIO21</text>

    <rect x="238" y="319" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="328" r="2.6" fill="#111827"/>
    <text x="230" y="332.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">GPIO22</text>
  </g>

  <!-- ==================== OLED 卡片 ==================== -->
  <rect x="440" y="100" width="204" height="300" rx="16" fill="#1e293b" stroke="#0b1220" stroke-width="1.2"/>
  <rect x="448" y="108" width="188" height="284" rx="11" fill="none" stroke="#334155"/>

  <text x="464" y="132" font-size="15" font-weight="700" fill="#f8fafc">OLED 0.96″</text>
  <text x="464" y="148" font-size="9" fill="#94a3b8">SSD1306 · 128×64 · I2C</text>

  <!-- 屏玻璃 -->
  <rect x="474" y="160" width="148" height="74" rx="3" fill="#05080f" stroke="#2b3648"/>
  <text x="548" y="196" font-size="30" font-weight="700" fill="#e8f1ff" text-anchor="middle"
        font-family="'SF Mono','Menlo','Consolas',monospace" letter-spacing="1">12:34</text>
  <text x="480" y="168" font-size="6.5" fill="#93a4bd">10/28 WED</text>
  <text x="480" y="228" font-size="6.5" fill="#93a4bd">UTC+8</text>
  <text x="616" y="228" font-size="6.5" fill="#93a4bd" text-anchor="end">NTP OK</text>

  <!-- 左缘引脚 -->
  <g>
    <rect x="420" y="205" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="214" r="2.6" fill="#111827"/>
    <text x="452" y="218.5" font-size="11.5" fill="#e2e8f0">VCC</text>

    <rect x="420" y="243" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="252" r="2.6" fill="#111827"/>
    <text x="452" y="256.5" font-size="11.5" fill="#e2e8f0">GND</text>

    <rect x="420" y="281" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="290" r="2.6" fill="#111827"/>
    <text x="452" y="294.5" font-size="11.5" fill="#e2e8f0">SDA</text>

    <rect x="420" y="319" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="328" r="2.6" fill="#111827"/>
    <text x="452" y="332.5" font-size="11.5" fill="#e2e8f0">SCL</text>
  </g>

  <text x="464" y="366" font-size="8" fill="#64748b">认准 4 针 I2C 版（丝印可能是</text>
  <text x="464" y="378" font-size="8" fill="#64748b">SDA/SDI、SCL/SCK），7 针 SPI 版不适用</text>

  <!-- ==================== 连线 ==================== -->
  <g stroke-linecap="round">
    <line x1="258" y1="214" x2="420" y2="214" stroke="#ef4444" stroke-width="3.4"/>
    <line x1="258" y1="252" x2="420" y2="252" stroke="#334155" stroke-width="3.4"/>
    <line x1="258" y1="290" x2="420" y2="290" stroke="#2563eb" stroke-width="3.4"/>
    <line x1="258" y1="328" x2="420" y2="328" stroke="#16a34a" stroke-width="3.4"/>
  </g>

  <!-- 线缆标签 -->
  <g font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">
    <rect x="293" y="203" width="100" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="218">3V3 → VCC</text>

    <rect x="318" y="241" width="50" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="256">GND</text>

    <rect x="293" y="279" width="100" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="294">GPIO21 · SDA</text>

    <rect x="293" y="317" width="100" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="332">GPIO22 · SCL</text>
  </g>

  <g font-size="7.5" fill="#94a3b8" text-anchor="middle">
    <text x="343" y="194">红</text>
    <text x="343" y="232">黑</text>
    <text x="343" y="270">蓝</text>
    <text x="343" y="308">绿</text>
  </g>

  <!-- ==================== 可选：唤醒按钮 ==================== -->
  <rect x="40" y="418" width="352" height="110" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="58" y="432" width="3" height="13" rx="1.5" fill="#f59e0b"/>
  <text x="70" y="443" font-size="12.5" font-weight="700" fill="#0f172a">可选：GPIO4 唤醒按钮</text>
  <text x="58" y="461" font-size="8.5" fill="#94a3b8">不接也能当时钟，只是要等下一个 30 秒才会刷新</text>

  <!-- 按钮接线 -->
  <g stroke-linecap="round">
    <line x1="106" y1="482" x2="158" y2="482" stroke="#f59e0b" stroke-width="2.6"/>
    <line x1="106" y1="510" x2="158" y2="510" stroke="#334155" stroke-width="2.6"/>
  </g>
  <rect x="60" y="474" width="46" height="16" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="83" y="485.5" font-size="8" font-weight="700" fill="#92400e" text-anchor="middle">GPIO4</text>
  <rect x="60" y="502" width="46" height="16" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="83" y="513.5" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">GND</text>

  <rect x="158" y="476" width="32" height="40" rx="5" fill="#334155" stroke="#475569"/>
  <circle cx="174" cy="496" r="8" fill="#64748b" stroke="#94a3b8"/>
  <circle cx="174" cy="496" r="3.4" fill="#334155"/>

  <text x="202" y="483" font-size="9" fill="#475569">短按：立刻联网校时</text>
  <text x="202" y="495" font-size="9" fill="#475569">长按 1.2s：校时 + 诊断页</text>
  <text x="202" y="507" font-size="9" fill="#475569">按住 3s：重新配网（开热点）</text>
  <text x="202" y="519" font-size="8" fill="#94a3b8">另一端接 GND，低电平触发</text>

  <!-- ==================== 真实排针顺序（30 pin） ==================== -->
  <rect x="408" y="418" width="352" height="300" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="426" y="432" width="3" height="13" rx="1.5" fill="#2563eb"/>
  <text x="438" y="443" font-size="12.5" font-weight="700" fill="#0f172a">30 pin 真实排针（天线朝上，USB 朝下）</text>

  <text x="426" y="462" font-size="7.5" font-weight="700" fill="#94a3b8">左排 ↓</text>
  <text x="608" y="462" font-size="7.5" font-weight="700" fill="#94a3b8">右排 ↓</text>

  <!-- 左排：EN 在最上，VIN 在最下 -->
  <g font-size="7.5" text-anchor="middle">
    <rect x="430" y="470" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="479" fill="#334155">EN</text>
    <rect x="430" y="484" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="493" fill="#334155">VP</text>
    <rect x="430" y="498" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="507" fill="#334155">VN</text>
    <rect x="430" y="512" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="521" fill="#334155">D34</text>
    <rect x="430" y="526" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="535" fill="#334155">D35</text>
    <rect x="430" y="540" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="549" fill="#334155">D32</text>
    <rect x="430" y="554" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="563" fill="#334155">D33</text>
    <rect x="430" y="568" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="577" fill="#334155">D25</text>
    <rect x="430" y="582" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="591" fill="#334155">D26</text>
    <rect x="430" y="596" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="605" fill="#334155">D27</text>
    <rect x="430" y="610" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="619" fill="#334155">D14</text>
    <rect x="430" y="624" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="633" fill="#334155">D12</text>
    <rect x="430" y="638" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="647" fill="#334155">D13</text>
    <rect x="430" y="652" width="44" height="12" rx="3" fill="#fbbf24" stroke="#b45309"/>
    <text x="452" y="661" fill="#111827">GND</text>
    <rect x="430" y="666" width="44" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="452" y="675" fill="#334155">VIN</text>
  </g>

  <!-- 中间：板子朝向示意 -->
  <rect x="492" y="474" width="100" height="196" rx="6" fill="#f8fafc" stroke="#dbe3f0"/>
  <rect x="500" y="482" width="84" height="16" rx="2" fill="#e2e8f0"/>
  <text x="542" y="493" font-size="6.5" fill="#94a3b8" text-anchor="middle">天线端 ↑</text>
  <rect x="512" y="506" width="60" height="42" rx="2" fill="#cbd5e1" stroke="#94a3b8"/>
  <text x="542" y="531" font-size="6.5" font-weight="700" fill="#475569" text-anchor="middle">WROOM-32</text>
  <text x="542" y="592" font-size="7" fill="#cbd5e1" text-anchor="middle">30 pin</text>
  <rect x="524" y="638" width="36" height="14" rx="3" fill="#94a3b8" stroke="#64748b"/>
  <rect x="530" y="641" width="24" height="8" rx="1.5" fill="#475569"/>
  <text x="542" y="664" font-size="6.5" fill="#94a3b8" text-anchor="middle">USB 端 ↓</text>

  <!-- 右排：3V3 在最上，D23 在最下 -->
  <g font-size="7.5" text-anchor="middle">
    <rect x="612" y="470" width="52" height="12" rx="3" fill="#fbbf24" stroke="#b45309"/>
    <text x="638" y="479" font-weight="700" fill="#111827">3V3</text>
    <rect x="612" y="484" width="52" height="12" rx="3" fill="#fbbf24" stroke="#b45309"/>
    <text x="638" y="493" font-weight="700" fill="#111827">GND</text>
    <rect x="612" y="498" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="507" fill="#334155">D15</text>
    <rect x="612" y="512" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="521" fill="#334155">D2</text>
    <rect x="612" y="526" width="52" height="12" rx="3" fill="#fed7aa" stroke="#d97706"/>
    <text x="638" y="535" font-weight="700" fill="#7c2d12">D4</text>
    <rect x="612" y="540" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="549" fill="#334155">D16</text>
    <rect x="612" y="554" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="563" fill="#334155">D17</text>
    <rect x="612" y="568" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="577" fill="#334155">D5</text>
    <rect x="612" y="582" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="591" fill="#334155">D18</text>
    <rect x="612" y="596" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="605" fill="#334155">D19</text>
    <rect x="612" y="610" width="52" height="12" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="638" y="619" font-weight="700" fill="#1e3a8a">D21</text>
    <rect x="612" y="624" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="633" fill="#334155">D3</text>
    <rect x="612" y="638" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="647" fill="#334155">D1</text>
    <rect x="612" y="652" width="52" height="12" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="638" y="661" font-weight="700" fill="#14532d">D22</text>
    <rect x="612" y="666" width="52" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="638" y="675" fill="#334155">D23</text>
  </g>

  <text x="426" y="694" font-size="7.5" fill="#64748b">高亮 = 本项目用到的脚：3V3、GND、D21（SDA）、D22（SCL）、D4（按钮）</text>
  <text x="426" y="708" font-size="7.5" fill="#94a3b8">D21 / D22 中间隔着 D3(RX0) 和 D1(TX0)，不是相邻的两根，按丝印接别按顺序数</text>

  <!-- ==================== 备注 ==================== -->
  <rect x="40" y="734" width="720" height="176" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="58" y="750" width="3" height="13" rx="1.5" fill="#16a34a"/>
  <text x="70" y="761" font-size="12.5" font-weight="700" fill="#0f172a">接线要点 · 五句话</text>

  <g font-size="10.5" fill="#475569">
    <g fill="#94a3b8">
      <circle cx="64" cy="781" r="2"/>
      <circle cx="64" cy="805" r="2"/>
      <circle cx="64" cy="829" r="2"/>
      <circle cx="64" cy="853" r="2"/>
      <circle cx="64" cy="877" r="2"/>
    </g>

    <text x="74" y="785">VCC 只接 <tspan font-weight="700" fill="#b45309">3V3</tspan>（右排最上面那根），接 5V / VIN 会烧屏；GND 用右排第二个，必须共地</text>
    <text x="74" y="809">SDA = <tspan font-weight="700" fill="#1d4ed8">GPIO21</tspan>，SCL = <tspan font-weight="700" fill="#15803d">GPIO22</tspan>：ESP32 的默认 I2C 脚，两脚中间隔着 RX0(3) / TX0(1)</text>
    <text x="74" y="833">GPIO21/22 不是 RTC 脚，不能深睡唤醒；按钮放 <tspan font-weight="700" fill="#b45309">GPIO4</tspan>（RTC IO，ext0 低电平唤醒），另一端接 GND</text>
    <text x="74" y="857">别占用 <tspan font-weight="700" fill="#b91c1c">GPIO2</tspan>（板载 LED）、0（BOOT）、12/15（strapping）、6–11（Flash）、1/3（串口）、34–39（只输入、无上拉）</text>
    <text x="74" y="881">板子是 micro-USB + CH340/CP2102，第一次用先装驱动；烧录和串口都是 115200，深睡时串口会断开</text>
  </g>

  <!-- ==================== 页脚 ==================== -->
  <text x="40" y="930" font-size="9" fill="#94a3b8">断电后接线 · 上电前复查 VCC / GND</text>
  <text x="760" y="930" font-size="9" fill="#94a3b8" text-anchor="end">esp32-ntp-clock · docs/wiring-esp32-devkit-v1.svg</text>
</svg>
