<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 800 720"
     font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">

  <!-- ==================== 背景 ==================== -->
  <rect width="800" height="720" fill="#f4f6fb"/>
  <circle cx="762" cy="42" r="108" fill="#e3eaf8" opacity="0.7"/>
  <circle cx="20" cy="660" r="78" fill="#e3eaf8" opacity="0.55"/>

  <!-- ==================== 标题 ==================== -->
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">ESP32-C3 SuperMini × 0.96″ OLED</text>
  <text x="40" y="68" font-size="11.5" fill="#64748b">NTP 网络时钟接线 · SSD1306 128×64 · I2C 四线 · 3.3V 供电 · 可选 IO3 唤醒键</text>

  <rect x="560" y="27" width="200" height="32" rx="16" fill="#ffffff" stroke="#dbe3f0"/>
  <circle cx="577" cy="43" r="3.4" fill="#2563eb"/>
  <text x="586" y="47" font-size="10.5" font-weight="700" fill="#1d4ed8">SDA  IO4</text>
  <circle cx="660" cy="43" r="3.4" fill="#16a34a"/>
  <text x="669" y="47" font-size="10.5" font-weight="700" fill="#15803d">SCL  IO5</text>

  <!-- ==================== ESP32-C3 卡片 ==================== -->
  <rect x="40" y="100" width="210" height="300" rx="16" fill="#1e293b" stroke="#0b1220" stroke-width="1.2"/>
  <rect x="48" y="108" width="194" height="284" rx="11" fill="none" stroke="#334155"/>

  <text x="60" y="132" font-size="15" font-weight="700" fill="#f8fafc">ESP32-C3</text>
  <text x="60" y="148" font-size="9" fill="#94a3b8">SuperMini · RISC-V · 2.4GHz WiFi</text>

  <!-- USB-C -->
  <rect x="22" y="118" width="19" height="44" rx="4" fill="#94a3b8" stroke="#64748b"/>
  <rect x="26" y="129" width="10" height="22" rx="2.5" fill="#475569"/>
  <text x="16" y="176" font-size="7.5" fill="#94a3b8" text-anchor="middle">USB-C</text>

  <!-- 电源灯 -->
  <circle cx="218" cy="126" r="3.2" fill="#22c55e"/>
  <circle cx="218" cy="126" r="6" fill="#22c55e" opacity="0.22"/>

  <!-- 天线走线 -->
  <g stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M60 186 h24 v-8 h14 v8 h14 v-8 h14 v8 h14"/>
  </g>
  <text x="60" y="200" font-size="7" fill="#64748b">2.4G 天线</text>

  <!-- 芯片 -->
  <rect x="104" y="244" width="58" height="58" rx="5" fill="#243144" stroke="#3b4a63"/>
  <rect x="116" y="256" width="34" height="34" rx="2" fill="#1b2534"/>
  <text x="133" y="278" font-size="8.5" font-weight="700" fill="#4d5d78" text-anchor="middle">C3</text>

  <!-- BOOT 键 -->
  <rect x="88" y="316" width="38" height="14" rx="3.5" fill="#334155" stroke="#475569"/>
  <text x="107" y="326" font-size="6.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">BOOT</text>
  <text x="132" y="326" font-size="7" fill="#94a3b8">= IO9</text>

  <text x="60" y="218" font-size="8" fill="#64748b">逻辑画法：只画用到的 4 个脚，</text>
  <text x="60" y="230" font-size="8" fill="#64748b">真实排针顺序见右下角</text>

  <!-- 右缘引脚（逻辑顺序） -->
  <g>
    <rect x="238" y="205" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="214" r="2.6" fill="#111827"/>
    <text x="230" y="218.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">3V3</text>

    <rect x="238" y="243" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="252" r="2.6" fill="#111827"/>
    <text x="230" y="256.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">GND</text>

    <rect x="238" y="281" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="290" r="2.6" fill="#111827"/>
    <text x="230" y="294.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">IO4</text>

    <rect x="238" y="319" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="256" cy="328" r="2.6" fill="#111827"/>
    <text x="230" y="332.5" font-size="11.5" fill="#e2e8f0" text-anchor="end">IO5</text>
  </g>

  <!-- ==================== OLED 卡片 ==================== -->
  <rect x="440" y="100" width="204" height="300" rx="16" fill="#1e293b" stroke="#0b1220" stroke-width="1.2"/>
  <rect x="448" y="108" width="188" height="284" rx="11" fill="none" stroke="#334155"/>

  <text x="464" y="132" font-size="15" font-weight="700" fill="#f8fafc">OLED 0.96″</text>
  <text x="464" y="148" font-size="9" fill="#94a3b8">SSD1306 · 128×64 · I2C</text>

  <!-- 屏玻璃 -->
  <rect x="474" y="160" width="148" height="74" rx="3" fill="#05080f" stroke="#2b3648"/>
  <text x="548" y="196" font-size="30" font-weight="700" fill="#e8f1ff" text-anchor="middle"
        font-family="'SF Mono','Menlo','Consolas',monospace" letter-spacing="1">12:34</text>
  <text x="480" y="168" font-size="6.5" fill="#93a4bd">10/28 WED</text>
  <text x="480" y="228" font-size="6.5" fill="#93a4bd">UTC+8</text>
  <text x="616" y="228" font-size="6.5" fill="#93a4bd" text-anchor="end">NTP OK</text>

  <!-- 左缘引脚 -->
  <g>
    <rect x="420" y="205" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="214" r="2.6" fill="#111827"/>
    <text x="452" y="218.5" font-size="11.5" fill="#e2e8f0">VCC</text>

    <rect x="420" y="243" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="252" r="2.6" fill="#111827"/>
    <text x="452" y="256.5" font-size="11.5" fill="#e2e8f0">GND</text>

    <rect x="420" y="281" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="290" r="2.6" fill="#111827"/>
    <text x="452" y="294.5" font-size="11.5" fill="#e2e8f0">SDA</text>

    <rect x="420" y="319" width="20" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <circle cx="424" cy="328" r="2.6" fill="#111827"/>
    <text x="452" y="332.5" font-size="11.5" fill="#e2e8f0">SCL</text>
  </g>

  <text x="464" y="366" font-size="8" fill="#64748b">认准 4 针 I2C 版（丝印可能是</text>
  <text x="464" y="378" font-size="8" fill="#64748b">SDA/SDI、SCL/SCK），7 针 SPI 版不适用</text>

  <!-- ==================== 连线 ==================== -->
  <g stroke-linecap="round">
    <line x1="258" y1="214" x2="420" y2="214" stroke="#ef4444" stroke-width="3.4"/>
    <line x1="258" y1="252" x2="420" y2="252" stroke="#334155" stroke-width="3.4"/>
    <line x1="258" y1="290" x2="420" y2="290" stroke="#2563eb" stroke-width="3.4"/>
    <line x1="258" y1="328" x2="420" y2="328" stroke="#16a34a" stroke-width="3.4"/>
  </g>

  <!-- 线缆标签 -->
  <g font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">
    <rect x="302" y="203" width="82" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="218">3V3 → VCC</text>

    <rect x="318" y="241" width="50" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="256">GND</text>

    <rect x="302" y="279" width="82" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="294">IO4 · SDA</text>

    <rect x="302" y="317" width="82" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="343" y="332">IO5 · SCL</text>
  </g>

  <g font-size="7.5" fill="#94a3b8" text-anchor="middle">
    <text x="343" y="194">红</text>
    <text x="343" y="232">黑</text>
    <text x="343" y="270">蓝</text>
    <text x="343" y="308">绿</text>
  </g>

  <!-- ==================== 可选：唤醒按钮 ==================== -->
  <rect x="40" y="418" width="352" height="110" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="58" y="432" width="3" height="13" rx="1.5" fill="#f59e0b"/>
  <text x="70" y="443" font-size="12.5" font-weight="700" fill="#0f172a">可选：IO3 唤醒按钮</text>
  <text x="58" y="461" font-size="8.5" fill="#94a3b8">不接也能当时钟，只是要等下一个 30 秒才会刷新</text>

  <!-- 按钮接线 -->
  <g stroke-linecap="round">
    <line x1="100" y1="482" x2="152" y2="482" stroke="#f59e0b" stroke-width="2.6"/>
    <line x1="100" y1="510" x2="152" y2="510" stroke="#334155" stroke-width="2.6"/>
  </g>
  <rect x="60" y="474" width="40" height="16" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="80" y="485.5" font-size="8" font-weight="700" fill="#92400e" text-anchor="middle">IO3</text>
  <rect x="60" y="502" width="40" height="16" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="80" y="513.5" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">GND</text>

  <rect x="152" y="476" width="32" height="40" rx="5" fill="#334155" stroke="#475569"/>
  <circle cx="168" cy="496" r="8" fill="#64748b" stroke="#94a3b8"/>
  <circle cx="168" cy="496" r="3.4" fill="#334155"/>

  <text x="196" y="483" font-size="9" fill="#475569">短按：立刻联网校时</text>
  <text x="196" y="495" font-size="9" fill="#475569">长按 1.2s：校时 + 诊断页</text>
  <text x="196" y="507" font-size="9" fill="#475569">按住 3s：重新配网（开热点）</text>
  <text x="196" y="519" font-size="8" fill="#94a3b8">另一端接 GND，低电平触发</text>

  <!-- ==================== 真实排针顺序 ==================== -->
  <rect x="408" y="418" width="352" height="110" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="426" y="432" width="3" height="13" rx="1.5" fill="#2563eb"/>
  <text x="438" y="443" font-size="12.5" font-weight="700" fill="#0f172a">C3 排针顺序（USB 朝上，以丝印为准）</text>

  <g font-size="7.5" fill="#64748b" text-anchor="middle">
    <text x="441" y="496">5V</text>
    <text x="477" y="496">G</text>
    <text x="513" y="496">3V3</text>
    <text x="549" y="496">4</text>
    <text x="585" y="496">3</text>
    <text x="621" y="496">2</text>
    <text x="657" y="496">1</text>
    <text x="693" y="496">0</text>
  </g>

  <g>
    <rect x="426" y="462" width="30" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="462" y="462" width="30" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="498" y="462" width="30" height="18" rx="4" fill="#fbbf24" stroke="#b45309"/>
    <rect x="534" y="462" width="30" height="18" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="570" y="462" width="30" height="18" rx="4" fill="#fed7aa" stroke="#d97706"/>
    <rect x="606" y="462" width="30" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="642" y="462" width="30" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="678" y="462" width="30" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  </g>

  <text x="426" y="514" font-size="8" fill="#64748b">高亮 = 本项目用到的脚：3V3、IO4、IO3（按钮）</text>
  <text x="426" y="525" font-size="8" fill="#94a3b8">IO5 在对面一排最上面；两排都是从 USB 那头数起</text>

  <!-- ==================== 备注 ==================== -->
  <rect x="40" y="542" width="720" height="156" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="58" y="558" width="3" height="13" rx="1.5" fill="#16a34a"/>
  <text x="70" y="569" font-size="12.5" font-weight="700" fill="#0f172a">接线要点 · 五句话</text>

  <g font-size="10.5" fill="#475569">
    <g fill="#94a3b8">
      <circle cx="64" cy="589" r="2"/>
      <circle cx="64" cy="611" r="2"/>
      <circle cx="64" cy="633" r="2"/>
      <circle cx="64" cy="655" r="2"/>
      <circle cx="64" cy="677" r="2"/>
    </g>

    <text x="74" y="593">VCC 只接 <tspan font-weight="700" fill="#b45309">3V3</tspan>（LDO 输出，带一块屏够用）；接 5V 有烧屏风险，GND 必须共地</text>
    <text x="74" y="615">SDA = <tspan font-weight="700" fill="#1d4ed8">IO4</tspan>，SCL = <tspan font-weight="700" fill="#b45309">IO5</tspan>：相邻、无 strapping；它们是 JTAG 脚，接了 I2C 就不能 JTAG 调试，不影响烧录</text>
    <text x="74" y="637">深睡唤醒只能用 <tspan font-weight="700">IO0–IO5</tspan>，IO4/IO5 已被 I2C 占用，所以按钮放 <tspan font-weight="700" fill="#b45309">IO3</tspan>；另一端接 GND</text>
    <text x="74" y="659">别占用 <tspan font-weight="700" fill="#b91c1c">IO8</tspan>（板载 LED，启动须为高）、IO2 / IO9（strapping / BOOT）、IO18/19（USB）、IO20/21（串口）</text>
    <text x="74" y="681">深睡时 SSD1306 会保持最后一帧，屏幕一直有时间，只是停在上一次刷新的分钟；杜邦线建议 ≤ 20cm</text>
  </g>

  <!-- ==================== 页脚 ==================== -->
  <text x="40" y="714" font-size="9" fill="#94a3b8">断电后接线 · 上电前复查 VCC / GND</text>
  <text x="760" y="714" font-size="9" fill="#94a3b8" text-anchor="end">esp32-ntp-clock · docs/wiring.svg</text>
</svg>
