; ESP32 DevKit V1 + 0.96" SSD1306 OLED · 天气屏
;
;   esp32dev  ESP32 DevKit V1 (WROOM-32)  SDA=GPIO21  SCL=GPIO22  按钮=GPIO4(可选)
;
; 编译：pio run
; 烧录：pio run -t upload
; 串口：pio device monitor        （115200，DevKit V1 走 CH340/CP2102）
;
; 第一次上电会开热点 WEATHER-XXXX，手机连上填 WiFi / 城市 / 数据源。
; 天气数据默认走 Open-Meteo（免 Key，HTTPS）；也可以切到 OpenWeather（需 Key）。

[platformio]
default_envs = esp32dev
;
; 可选的本地覆盖（不进 git）：路径太长导致 g++ 命令行超过 Windows 32767 字符时，
; 可以在 platformio.local.ini 里写 core_dir = C:/pio（见 README「Windows 编译报错」）。
extra_configs = platformio.local.ini

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time

; 中文字库 + ArduinoJson 7 会让固件超过默认 1.2MB 分区，用 3MB app 分区
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_ESP32_DEVKIT_V1
    -DCORE_DEBUG_LEVEL=0
    -DSSD1306_NO_SPLASH
    -finput-charset=UTF-8
    -fexec-charset=UTF-8
    -Wall

lib_deps =
    olikraus/U8g2
    bblanchon/ArduinoJson @ ^7.0.0
