; ESP32 DevKit V1 + 0.96" SSD1306 OLED · Flappy Bird
;
;   esp32dev  ESP32 DevKit V1 (WROOM-32)  SDA=GPIO21  SCL=GPIO22  按键=板载 BOOT(GPIO0)
;
; 编译：pio run
; 烧录：pio run -t upload
; 串口：pio device monitor        （115200，DevKit V1 走 CH340 / CP2102）
;
; 注意：BOOT 是 GPIO0，按住 BOOT 再点 EN/复位 会进下载模式，这是芯片设计如此；
;       正常运行时它就是普通输入键，可以随便按。

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DSSD1306_NO_SPLASH
    -Wall

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.17
    adafruit/Adafruit GFX Library @ ^1.13.0
    adafruit/Adafruit BusIO @ ^1.17.4
