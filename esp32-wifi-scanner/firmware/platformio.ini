; ESP32-C3 SuperMini · 0.96" OLED WiFi 扫描器
;
;   编译：pio run
;   烧录：pio run -t upload
;   串口：pio device monitor
;
; 板载 USB-C 是原生 USB（没有 CH340），必须打开 USB CDC，
; 否则串口监视器里什么都看不到。

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32 @ 6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.17
    adafruit/Adafruit GFX Library @ ^1.13.0
    adafruit/Adafruit BusIO @ ^1.17.4
